name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Reproduce experiments
        run: python src/experiments.py

      - name: Check key metrics (regression guard)
        run: |
          python - <<'PY'
          import json
          r = json.load(open("output/results.json", encoding="utf-8"))
          s = {x["scheme"]: x for x in r["schemes"]}

          # 三方案关键指标应落在区间内（容许跨平台的浮点微差）
          assert 34.8 < s["S2"]["exp_cost"] < 37.8, s["S2"]["exp_cost"]
          assert 0.24 < s["S2"]["p_acc"] < 0.27, s["S2"]["p_acc"]
          assert 95 < s["S2"]["p95_cost"] < 115, s["S2"]["p95_cost"]
          assert s["S3"]["p_acc"] < s["S2"]["p_acc"] < s["S1"]["p_acc"]

          # 共同随机数检验：S2 与扫描档位 I=20 必须完全一致
          sw = {x["I"]: x for x in r["sweep"]}
          assert abs(sw[20]["exp_cost"] - s["S2"]["exp_cost"]) < 0.01

          # 敏感性基准必须等于均衡方案本身
          assert abs(r["sensitivity"]["base_cost"] - s["S2"]["exp_cost"]) < 0.01

          # 置信区间应包住点估计
          for x in r["schemes"]:
              assert x["exp_cost_ci"][0] < x["exp_cost"] < x["exp_cost_ci"][1]
          print("metrics OK")
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: output/
          if-no-files-found: error
