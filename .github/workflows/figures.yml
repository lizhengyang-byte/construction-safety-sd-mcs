name: Figures

# 自动生成七张 SVG 配图并回写仓库，保证 docs/figures 始终与 results.json 同步

on:
  workflow_dispatch:
  push:
    paths:
      - "src/render_svg.py"
      - "src/model.py"
      - "src/experiments.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 重算实验并生成 SVG
        run: |
          python src/experiments.py
          python src/render_svg.py

      - name: 回写图片
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures/*.svg
          if git diff --cached --quiet; then
            echo "图表无变化"
          else
            git commit -m "chore: 自动生成七张 SVG 配图"
            git push
          fi
